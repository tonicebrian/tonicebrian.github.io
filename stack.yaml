# For more information, see: http://docs.haskellstack.org/en/stable/yaml_configuration/

# nightly-2026-09-01 ships GHC 9.12.4 and hakyll-4.17.0.0.
# No LTS snapshot ships GHC 9.12 yet, so a pinned nightly is the way to get it.
resolver: nightly-2026-09-01

# Local packages, usually specified by relative directory name
packages:
- '.'

# Use the GHC 9.12.4 that ghcup has set globally on this machine instead of
# letting stack download a private copy.
system-ghc: true
install-ghc: false

flags: {}
extra-package-dbs: []
